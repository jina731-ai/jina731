<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할인율 계산기 | 생활 계산기 모음</title>
<meta name="description" content="할인가, 할인율, 중복 할인(30% 후 10% 추가 등)의 실제 할인율을 계산합니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="생활 계산기 모음">
<meta property="og:title" content="할인율 계산기 | 생활 계산기 모음">
<meta property="og:description" content="할인가, 할인율, 중복 할인(30% 후 10% 추가 등)의 실제 할인율을 계산합니다.">
<meta property="og:locale" content="ko_KR">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:4px 16px 40px;background:#f6f8fa}
.site-nav{max-width:560px;margin:16px auto 0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.site-nav a{color:#1f6feb;text-decoration:none;font-weight:600}
.site-nav a:hover{text-decoration:underline}
.site-foot{max-width:760px;margin:24px auto 0;text-align:center;color:#8a95a3;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
</style>
</head>
<body>
<nav class="site-nav"><a href="./">← 전체 계산기 보기</a></nav>
<div class="ms-calc" id="ms-disc">
<style>
.ms-calc{--ms-accent:#1f6feb;--ms-soft:#f4f7fb;--ms-line:#dde3ea;--ms-text:#1d2733;--ms-muted:#5f6b7a;max-width:560px;margin:24px auto;padding:20px;border:1px solid var(--ms-line);border-radius:14px;background:#fff;color:var(--ms-text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;box-sizing:border-box}
.ms-calc *{box-sizing:border-box}.ms-calc [hidden]{display:none!important}
.ms-calc h3{margin:0 0 4px;font-size:20px}
.ms-calc .ms-sub{margin:0 0 16px;color:var(--ms-muted);font-size:13px}
.ms-calc .ms-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ms-calc label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.ms-calc input{width:100%;padding:10px 12px;border:1px solid var(--ms-line);border-radius:8px;font-size:16px;background:#fff;color:var(--ms-text);font-family:inherit}
.ms-calc input:focus{outline:2px solid var(--ms-accent);outline-offset:-1px;border-color:transparent}
.ms-calc .ms-seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ms-calc .ms-seg button{flex:1;padding:9px 6px;border:1px solid var(--ms-line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;color:var(--ms-text);font-family:inherit}
.ms-calc .ms-seg button[aria-pressed="true"]{background:var(--ms-accent);border-color:var(--ms-accent);color:#fff;font-weight:600}
.ms-calc .ms-result{margin-top:16px;padding:16px;border-radius:10px;background:var(--ms-soft)}
.ms-calc .ms-label{font-size:13px;color:var(--ms-muted)}
.ms-calc .ms-big{font-size:26px;font-weight:700;color:var(--ms-accent);font-variant-numeric:tabular-nums}
.ms-calc .ms-msg{font-size:13.5px;margin-top:4px}
.ms-calc .ms-note{margin-top:12px;font-size:12.5px;color:var(--ms-muted)}
@media (max-width:480px){.ms-calc{padding:16px;margin:16px 0}.ms-calc .ms-row{grid-template-columns:1fr}}
</style>

<h3>할인율 계산기</h3>
<p class="ms-sub">할인된 가격, 실제 할인율, 중복 할인 결과를 계산합니다.</p>

<div class="ms-seg" data-seg="mode" role="group">
  <button type="button" data-v="price" aria-pressed="true">할인가 구하기</button>
  <button type="button" data-v="rate" aria-pressed="false">할인율 구하기</button>
  <button type="button" data-v="double" aria-pressed="false">중복 할인</button>
</div>

<div class="ms-row">
  <div><label for="dc-orig">정가 (원)</label><input id="dc-orig" class="ms-money" type="text" inputmode="numeric" value="89,000"></div>
  <div id="dc-ratebox"><label for="dc-r1" id="dc-r1label">할인율 (%)</label><input id="dc-r1" type="number" min="0" max="100" step="0.1" value="30"></div>
  <div id="dc-salebox" hidden><label for="dc-sale">판매가 (원)</label><input id="dc-sale" class="ms-money" type="text" inputmode="numeric" value="62,300"></div>
</div>
<div class="ms-row" id="dc-r2box" hidden>
  <div><label for="dc-r2">두 번째 할인율 (%, 쿠폰·카드 등)</label><input id="dc-r2" type="number" min="0" max="100" step="0.1" value="10"></div>
</div>

<div class="ms-result" aria-live="polite">
  <div class="ms-label" id="dc-biglabel">할인가</div>
  <div class="ms-big" id="dc-out">0원</div>
  <div class="ms-msg" id="dc-msg"></div>
</div>

<p class="ms-note">
· 할인가 = 정가 × (1 − 할인율). 할인율 = (정가 − 판매가) ÷ 정가 × 100.<br>
· 중복 할인은 더해지지 않고 차례로 곱해집니다. 30% 할인 뒤 10% 추가 할인은 40%가 아니라 37% 할인입니다.
</p>

<script>
(function(){
  var root=document.getElementById('ms-disc'); if(!root) return;
  function $(id){return root.querySelector('#'+id);}
  function num(v){return Number(String(v).replace(/[^0-9.]/g,''))||0;}
  function won(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
  function seg(n){var b=root.querySelector('[data-seg="'+n+'"] [aria-pressed="true"]');return b?b.getAttribute('data-v'):'';}
  function r1(n){return Math.round(n*10)/10;}
  function calc(){
    var mode=seg('mode'), o=num($('dc-orig').value), a=num($('dc-r1').value)/100, b=num($('dc-r2').value)/100;
    $('dc-ratebox').hidden= mode==='rate'; $('dc-salebox').hidden= mode!=='rate'; $('dc-r2box').hidden= mode!=='double';
    $('dc-r1label').textContent= mode==='double'?'첫 번째 할인율 (%)':'할인율 (%)';
    if(mode==='price'){
      $('dc-biglabel').textContent='할인가';$('dc-out').textContent=won(o*(1-a));
      $('dc-msg').textContent=won(o*a)+' 할인';
    } else if(mode==='rate'){
      var s=num($('dc-sale').value);
      $('dc-biglabel').textContent='할인율';$('dc-out').textContent=(o?r1((o-s)/o*100):0)+'%';
      $('dc-msg').textContent= o? (s<=o? won(o-s)+' 싸게 삽니다.':won(s-o)+' 비쌉니다 (인상률 '+r1((s-o)/o*100)+'%).') :'';
    } else {
      var fin=o*(1-a)*(1-b);
      $('dc-biglabel').textContent='최종 가격';$('dc-out').textContent=won(fin);
      $('dc-msg').textContent='실제 총 할인율 '+(o?r1((o-fin)/o*100):0)+'% · '+won(o-fin)+' 할인 (1차 후 '+won(o*(1-a))+')';
    }
  }
  root.addEventListener('click',function(e){var b=e.target.closest('.ms-seg button');if(!b)return;b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});calc();});
  root.addEventListener('input',function(e){if(e.target.classList.contains('ms-money')){var n=num(e.target.value);e.target.value=n?Math.floor(n).toLocaleString('ko-KR'):'';}calc();});
  calc();
})();
</script>
</div>
<p class="site-foot">생활 계산기 모음 · 계산 결과는 참고용 추정치입니다.</p>
</body>
</html>
