<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-day 날짜 계산기 | 생활 계산기 모음</title>
<meta name="description" content="D-day, 두 날짜 사이 기간, 100일·1000일 기념일 날짜를 계산합니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="생활 계산기 모음">
<meta property="og:title" content="D-day 날짜 계산기 | 생활 계산기 모음">
<meta property="og:description" content="D-day, 두 날짜 사이 기간, 100일·1000일 기념일 날짜를 계산합니다.">
<meta property="og:locale" content="ko_KR">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:4px 16px 40px;background:#f6f8fa}
.site-nav{max-width:560px;margin:16px auto 0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.site-nav a{color:#1f6feb;text-decoration:none;font-weight:600}
.site-nav a:hover{text-decoration:underline}
.site-foot{max-width:760px;margin:24px auto 0;text-align:center;color:#8a95a3;font:12px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
</style>
</head>
<body>
<nav class="site-nav"><a href="./">← 전체 계산기 보기</a></nav>
<div class="ms-calc" id="ms-dday">
<style>
.ms-calc{--ms-accent:#1f6feb;--ms-soft:#f4f7fb;--ms-line:#dde3ea;--ms-text:#1d2733;--ms-muted:#5f6b7a;--ms-warn:#b54708;max-width:560px;margin:24px auto;padding:20px;border:1px solid var(--ms-line);border-radius:14px;background:#fff;color:var(--ms-text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;box-sizing:border-box}
.ms-calc *{box-sizing:border-box}.ms-calc [hidden]{display:none!important}
.ms-calc h3{margin:0 0 4px;font-size:20px}
.ms-calc .ms-sub{margin:0 0 16px;color:var(--ms-muted);font-size:13px}
.ms-calc .ms-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ms-calc label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.ms-calc label.ms-chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin-bottom:10px}
.ms-calc label.ms-chk input{width:auto;margin:0}
.ms-calc input{width:100%;padding:10px 12px;border:1px solid var(--ms-line);border-radius:8px;font-size:16px;background:#fff;color:var(--ms-text);font-family:inherit}
.ms-calc input:focus{outline:2px solid var(--ms-accent);outline-offset:-1px;border-color:transparent}
.ms-calc .ms-seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ms-calc .ms-seg button{flex:1;padding:9px 6px;border:1px solid var(--ms-line);border-radius:8px;background:#fff;font-size:14px;cursor:pointer;color:var(--ms-text);font-family:inherit}
.ms-calc .ms-seg button[aria-pressed="true"]{background:var(--ms-accent);border-color:var(--ms-accent);color:#fff;font-weight:600}
.ms-calc .ms-result{margin-top:16px;padding:16px;border-radius:10px;background:var(--ms-soft)}
.ms-calc .ms-label{font-size:13px;color:var(--ms-muted)}
.ms-calc .ms-big{font-size:26px;font-weight:700;color:var(--ms-accent);font-variant-numeric:tabular-nums}
.ms-calc .ms-msg{font-size:13.5px;margin-top:4px}
.ms-calc table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.ms-calc td{padding:7px 0;border-top:1px solid var(--ms-line);text-align:right;font-variant-numeric:tabular-nums}
.ms-calc td:first-child{text-align:left}
.ms-calc .ms-note{margin-top:12px;font-size:12.5px;color:var(--ms-muted)}
@media (max-width:480px){.ms-calc{padding:16px;margin:16px 0}.ms-calc .ms-row{grid-template-columns:1fr}}
</style>

<h3>D-day · 날짜 계산기</h3>
<p class="ms-sub">남은 날짜, 두 날짜 사이 기간, N일 뒤 날짜를 계산합니다.</p>

<div class="ms-seg" data-seg="mode" role="group">
  <button type="button" data-v="dday" aria-pressed="true">D-day</button>
  <button type="button" data-v="between" aria-pressed="false">두 날짜 사이</button>
  <button type="button" data-v="add" aria-pressed="false">N일 뒤 날짜</button>
</div>

<div class="ms-row">
  <div><label for="dd-a" id="dd-alabel">기준일 (오늘)</label><input id="dd-a" type="date"></div>
  <div id="dd-bbox"><label for="dd-b" id="dd-blabel">목표일</label><input id="dd-b" type="date"></div>
  <div id="dd-nbox" hidden><label for="dd-n">더할 일수 (빼려면 −)</label><input id="dd-n" type="number" value="100"></div>
</div>
<label class="ms-chk" id="dd-incbox"><input id="dd-inc" type="checkbox"> 시작일을 1일로 셈 (기념일·연애 일수 방식)</label>

<div class="ms-result" aria-live="polite">
  <div class="ms-label" id="dd-biglabel">D-day</div>
  <div class="ms-big" id="dd-out">-</div>
  <div class="ms-msg" id="dd-msg"></div>
  <table id="dd-table"></table>
</div>

<p class="ms-note">
· D-day는 목표일까지 남은 날 수입니다 (목표일 당일 = D-day, 하루 전 = D-1).<br>
· "시작일을 1일로 셈"을 켜면 사귄 날·태어난 날을 1일째로 세어 100일 기념일 등을 계산합니다.
</p>

<script>
(function(){
  var root=document.getElementById('ms-dday'); if(!root) return;
  var W=['일','월','화','수','목','금','토'], DAY=864e5;
  function $(id){return root.querySelector('#'+id);}
  function parse(s){if(!s)return null;var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2]);}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function fmt(d){return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+W[d.getDay()]+')';}
  function diff(a,b){return Math.round((b-a)/DAY);}
  function seg(n){var b=root.querySelector('[data-seg="'+n+'"] [aria-pressed="true"]');return b?b.getAttribute('data-v'):'';}
  var t=new Date(); $('dd-a').value=iso(t); $('dd-b').value=(t.getFullYear()+1)+'-01-01';
  function calc(){
    var mode=seg('mode'), a=parse($('dd-a').value), b=parse($('dd-b').value), inc=$('dd-inc').checked;
    $('dd-bbox').hidden= mode==='add'; $('dd-nbox').hidden= mode!=='add'; $('dd-incbox').hidden= mode==='dday';
    $('dd-alabel').textContent= mode==='dday'?'기준일 (오늘)':'시작일';
    $('dd-blabel').textContent= mode==='dday'?'목표일':'종료일';
    var rows=[];
    if(!a){return;}
    if(mode==='dday'){
      if(!b)return; var d=diff(a,b);
      $('dd-biglabel').textContent='D-day';
      $('dd-out').textContent= d===0?'D-day':d>0?'D-'+d:'D+'+(-d);
      $('dd-msg').textContent=fmt(b)+(d>0?'까지 '+d+'일 남았습니다.':d<0?'부터 '+(-d)+'일 지났습니다.':' 오늘입니다.');
      rows=[['남은 주',Math.floor(Math.abs(d)/7)+'주 '+(Math.abs(d)%7)+'일'],['목표일 요일',W[b.getDay()]+'요일']];
    } else if(mode==='between'){
      if(!b)return; var n=diff(a,b)+(inc?1:0);
      $('dd-biglabel').textContent='기간';
      $('dd-out').textContent=n.toLocaleString('ko-KR')+'일';
      var m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth(); if(b.getDate()<a.getDate()) m--;
      $('dd-msg').textContent=fmt(a)+' ~ '+fmt(b);
      rows=[['주 단위',Math.floor(n/7)+'주 '+(n%7)+'일'],['개월 단위',Math.floor(m/12)+'년 '+(m%12)+'개월'],['시간',(n*24).toLocaleString('ko-KR')+'시간']];
    } else {
      var k=Math.floor(Number($('dd-n').value)||0), r=new Date(a.getFullYear(),a.getMonth(),a.getDate()+k-(inc&&k>0?1:0));
      $('dd-biglabel').textContent= inc&&k>0 ? k+'일째 되는 날' : k+'일 '+(k>=0?'뒤':'전');
      $('dd-out').textContent=iso(r);
      $('dd-msg').textContent=fmt(r);
      [100,200,300,365,500,1000].forEach(function(x){var d=new Date(a.getFullYear(),a.getMonth(),a.getDate()+x-(inc?1:0));rows.push([x+'일'+(inc?'째':' 뒤'),fmt(d)]);});
    }
    $('dd-table').innerHTML=rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('');
  }
  root.addEventListener('click',function(e){var b=e.target.closest('.ms-seg button');if(!b)return;b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});calc();});
  root.addEventListener('input',calc);
  root.addEventListener('change',calc);
  calc();
})();
</script>
</div>
<p class="site-foot">생활 계산기 모음 · 계산 결과는 참고용 추정치입니다.</p>
</body>
</html>
